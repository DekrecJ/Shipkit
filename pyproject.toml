[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="shipkit-ai"
version="0.2.0"
description="Software delivery orchestrator for AI coding agents such as Codex and Claude Code."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=[]

[project.scripts]
shipkit="shipkit.cli:main"

[tool.setuptools]
include-package-data=true
[tool.setuptools.packages.find]
include=["shipkit*"]
[tool.setuptools.package-data]
shipkit=["assets/**/*"]
